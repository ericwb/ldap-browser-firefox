name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install flake8
      - run: flake8 host tests

  extension:
    name: extension (web-ext lint, JS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: JS unit tests
        run: node --test tests/*.test.mjs
      - name: Lint add-on
        run: npx --yes web-ext@10.8.0 lint --source-dir extension --warnings-as-errors

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install slapd
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y slapd
          sudo systemctl stop slapd || true
          # Ubuntu confines /usr/sbin/slapd with AppArmor, which blocks the
          # throwaway server the tests run from a temp directory.
          if [ -f /etc/apparmor.d/usr.sbin.slapd ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd || true
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r host/requirements.txt pytest
      # Integration tests need slapd: they run on Linux (distro OpenLDAP,
      # including StartTLS) and macOS (Apple's slapd), and skip on Windows.
      - name: Run tests
        run: pytest -v -rs

  ui:
    name: ui (Playwright Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install slapd
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y slapd
          sudo systemctl stop slapd || true
          if [ -f /etc/apparmor.d/usr.sbin.slapd ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd || true
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r host/requirements.txt pytest playwright
          python -m playwright install --with-deps firefox
      - name: Run UI tests
        env:
          UI_SHOTS: ui-screenshots
        run: pytest -v tests/test_ui.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screenshots
          path: ui-screenshots/
          if-no-files-found: ignore

  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install helper (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          ./install.sh
          ./install.sh --uninstall
      - name: Install helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          $key = "HKCU:\Software\Mozilla\NativeMessagingHosts\ldap_browser_host"
          $manifest = (Get-ItemProperty -Path $key)."(default)"
          Get-Content $manifest
          # Send a "hello" through the registered launcher, as Firefox would.
          $launcher = (Get-Content $manifest | ConvertFrom-Json).path
          python -c "import json,struct,subprocess,sys; m=json.dumps({'id':1,'op':'hello'}).encode(); o=subprocess.run([sys.argv[1]],input=struct.pack('@I',len(m))+m,capture_output=True,timeout=60).stdout; n=struct.unpack('@I',o[:4])[0]; r=json.loads(o[4:4+n]); print(r); sys.exit(0 if r['ok'] else 1)" $launcher
          ./install.ps1 -Uninstall
