name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5
        with:
          # This project is GPL-3.0-only, so (L)GPL dependencies such as ldap3
          # (LGPL-3.0) are fine; block licenses that can't be combined with it.
          deny-licenses: GPL-2.0-only
